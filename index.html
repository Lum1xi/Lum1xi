<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lum1xi | Bio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://kit.fontawesome.com/330df0be73.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=3293&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }



        .control-icon {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-icon:hover {
            color: white;
        }

        .main-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    padding: 20px;
    
    isolation: isolate; 
}

        .pixel-title {
            font-family: 'VT323', monospace;
            font-size: 4.5rem;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #d1d5db;
        }

        .location {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 30px;
            color: #e5e7eb;
        }

        .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    width: 100%;
    margin-bottom: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    
    position: relative;
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    width: 100%;
    margin-bottom: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    z-index: 1;
}

        .glass-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: -1;
}
        .profile-section {
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar-container {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 12px;
            height: 12px;
            background-color: #9ca3af; 
            border-radius: 50%;
            border: 2px solid #1e293b;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-weight: 600;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: bold;
        }

        .badge-blue {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .profile-status {
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .bio-section {
            padding: 20px 25px;
        }

        .bio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bio-content {
            margin-top: 15px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        .skill-highlight {
            color: var(--accent);
            font-weight: 500;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding: 10px;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
        }

        .social-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 1.6rem;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-up {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>


    <div class="main-container animate-up">
        <h1 class="pixel-title">LUM1XI</h1>
        <div class="subtitle">DEVELOPER</div>


        <div class="glass-panel profile-section">
            <div class="avatar-container">
                <img src="1.jpg" alt="Lum1xi" class="avatar">
            </div>
            <div class="profile-info">
                <div class="profile-name">
                    Lum1xi 
                    <span class="badge">CODE</span>
                </div>
                <div class="profile-status">Tm90aGluZwo=</div>
            </div>
        </div>

        <div class="glass-panel bio-section">
            <div class="bio-header" onclick="toggleBio()">
                <span>BIO</span>
                <i class="ph ph-caret-down" id="bio-caret" style="transition: transform 0.3s;"></i>
            </div>
            <div class="bio-content" id="bio-text" style="display: block;">
                Passionate about programming, game development, and creating Telegram bots. <br><br>
                Skilled in <span class="skill-highlight">Python, Lua, C#, and C++</span>. <br><br>
                🎭 Member of <strong>NebulaByte Studios</strong><br><br>
                🚀 My main goal is to release my own game on Steam.
            </div>
        </div>


        <div class="social-icons">
            <a href="https://t.me/Hub_H" target="_blank" class="social-icon" title="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>
            <a href="https://discord.com/users/415800210787139594" target="_blank" class="social-icon" title="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://github.com/Lum1xi" target="_blank" class="social-icon" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://www.fiverr.com/users/lum1xi/" target="_blank" class="social-icon" title="Fiverr">  
                <svg fill="#ffffff" width="32px" height="32px" viewBox="-2.5 -2 24 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin" class="jam jam-fiverr" stroke="#ffffff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M16.25 16.25v-10h-10v-.625c0-1.034.841-1.875 1.875-1.875H10V0H8.125A5.632 5.632 0 0 0 2.5 5.625v.625H0V10h2.5v6.25H0V20h8.75v-3.75h-2.5V10h6.285v6.25H10V20h8.75v-3.75h-2.5z"></path><circle cx="14.375" cy="1.875" r="1.875"></circle></g></svg>

            </a>
        </div>
    </div>

    <script>

        function toggleBio() {
            const content = document.getElementById('bio-text');
            const caret = document.getElementById('bio-caret');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                caret.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                caret.style.transform = 'rotate(180deg)';
            }
        }
    </script>
</body>
</html>
